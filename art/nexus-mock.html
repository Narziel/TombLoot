<!doctype html>
<html><head><meta charset="utf-8"><title>Nexus header mock</title>
<style>
  /* Rough mock of the Nexus mod page header, to check what the banner keeps visible. */
  body { margin: 0; background: #101010; font-family: Segoe UI, sans-serif; color: #fff; }
  .nav { height: 75px; background: #1b1b1d; }
  .hdr { position: relative; height: 550px; background: url(banner.png) center / cover no-repeat; }
  .crumb { position: absolute; left: 62px; top: 330px; color: #d98f3a; font-size: 18px; }
  .name { position: absolute; left: 62px; top: 365px; font-size: 64px; }
  .stats { position: absolute; left: 62px; top: 470px; font-size: 16px; color: #ddd; }
  .btns { position: absolute; right: 30px; top: 470px; display: flex; gap: 12px; }
  .btns span { padding: 12px 18px; background: #222; border: 1px solid #555; border-radius: 4px; }
  .btns span.o { background: #e8892f; border: 0; }
  .manage { position: absolute; right: 30px; top: 30px; padding: 12px 18px; background: #e8892f; border-radius: 4px; }
</style></head>
<body><div class="nav"></div><div class="hdr">
  <div class="manage">Manage</div>
  <div class="crumb">Games / Skyrim Special Edition / Mods / Immersion / TombLoot</div>
  <div class="name">TombLoot</div>
  <div class="stats">Endorsements 0 &nbsp;&nbsp; Unique DLs -- &nbsp;&nbsp; Total DLs -- &nbsp;&nbsp; Total views -- &nbsp;&nbsp; Version 1.0.0</div>
  <div class="btns"><span>Add media</span><span>Track</span><span>Endorse</span><span>Vote</span><span class="o">Vortex</span><span class="o">Manual</span></div>
</div></body></html>
